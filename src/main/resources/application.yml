spring:
  application:
    name: moera-import-service

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/moera_import}
    username: ${DATABASE_USERNAME:moera_import}
    password: ${DATABASE_PASSWORD:}

  flyway:
    enabled: true

  jooq:
    sql-dialect: postgres

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

moera:
  telegram:
    enabled: ${MOERA_TELEGRAM_ENABLED:false}
    login: ${MOERA_TELEGRAM_LOGIN:false}
    api-id: ${TELEGRAM_API_ID:0}
    api-hash: ${TELEGRAM_API_HASH:}
    database-directory: ${TELEGRAM_DATABASE_DIRECTORY:var/telegram/database}
    download-cache-directory: ${TELEGRAM_DOWNLOAD_CACHE_DIRECTORY:var/telegram/cache}
    grouping-threshold: ${TELEGRAM_GROUPING_THRESHOLD:5m}
    settling-delay: ${TELEGRAM_SETTLING_DELAY:30s}
    polling-interval: ${TELEGRAM_POLLING_INTERVAL:1m}
    inactive-polling-interval: ${TELEGRAM_INACTIVE_POLLING_INTERVAL:10m}
    look-behind-count: ${TELEGRAM_LOOK_BEHIND_COUNT:20}
    history-page-size: ${TELEGRAM_HISTORY_PAGE_SIZE:100}
    readiness-timeout: ${TELEGRAM_READINESS_TIMEOUT:30s}
    login-timeout: ${TELEGRAM_LOGIN_TIMEOUT:10m}
  workers:
    scheduling-enabled: true
    batch-size: 32
    channel-lease: 5m
    channel-schedule-interval: 1s
    publication-builder-schedule-interval: 1s
    publication-media-lease: 5m
    publication-media-schedule-interval: 1s
    publication-lease: 5m
    publication-schedule-interval: 1s
    media-compression-poll-interval: 10s
    staging-directory: ${MOERA_STAGING_DIRECTORY:var/staging}
    retry-base-delay: 1s
    retry-max-delay: 1h
    retry-jitter-fraction: 0.2
