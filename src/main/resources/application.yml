spring:
  application:
    name: moera-import-service

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/moera_import}
    username: ${DATABASE_USERNAME:moera_import}
    password: ${DATABASE_PASSWORD:}

  flyway:
    enabled: true

  jooq:
    sql-dialect: postgres

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

moera:
  workers:
    scheduling-enabled: true
    batch-size: 32
    channel-lease: 5m
    channel-schedule-interval: 1s
    publication-builder-schedule-interval: 1s
    retry-base-delay: 1s
    retry-max-delay: 1h
    retry-jitter-fraction: 0.2
