spring:
  application:
    name: moera-import-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/moera_import}
    username: ${DATABASE_USERNAME:moera_import}
    password: ${DATABASE_PASSWORD:}

  flyway:
    enabled: true

  jooq:
    sql-dialect: postgres

logging:
  file:
    name: ${LOG_FILE:log/moera-import.log}
  level:
    it.tdlight: WARN
  logback:
    rollingpolicy:
      clean-history-on-start: false
      max-file-size: 100MB
      max-history: 7
      total-size-cap: 0B

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,importReadiness
  endpoints:
    web:
      exposure:
        include: health,prometheus

moera:
  version: ^project.version^
  naming-server: ${MOERA_NAMING_SERVER:main}
  authentication:
    name: ${MOERA_AUTHENTICATION_NAME:importer_0}
    signing-key: ${MOERA_AUTHENTICATION_SIGNING_KEY:}
    addresses: ${MOERA_AUTHENTICATION_ADDRESSES:}
  profile:
    contact-email: ${MOERA_PROFILE_CONTACT_EMAIL:balu@moera.org}
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    login: ${TELEGRAM_LOGIN:false}
    api-id: ${TELEGRAM_API_ID:0}
    api-hash: ${TELEGRAM_API_HASH:}
    database-directory: ${TELEGRAM_DATABASE_DIRECTORY:var/telegram/database}
    download-cache-directory: ${TELEGRAM_DOWNLOAD_CACHE_DIRECTORY:var/telegram/cache}
    grouping-threshold: ${TELEGRAM_GROUPING_THRESHOLD:30s}
    settling-delay: ${TELEGRAM_SETTLING_DELAY:1m}
    polling-interval: ${TELEGRAM_POLLING_INTERVAL:30m}
    inactive-polling-interval: ${TELEGRAM_INACTIVE_POLLING_INTERVAL:10m}
    look-behind-count: ${TELEGRAM_LOOK_BEHIND_COUNT:20}
    history-page-size: ${TELEGRAM_HISTORY_PAGE_SIZE:100}
    initial-history-count: ${TELEGRAM_INITIAL_HISTORY_COUNT:20}
    readiness-timeout: ${TELEGRAM_READINESS_TIMEOUT:30s}
    login-timeout: ${TELEGRAM_LOGIN_TIMEOUT:10m}
  delivery:
    create-rate:
      count: ${MOERA_CREATE_RATE_COUNT:10}
      period: ${MOERA_CREATE_RATE_PERIOD:1m}
  workers:
    scheduling-enabled: true
    batch-size: 32
    channel-concurrency: ${MOERA_CHANNEL_CONCURRENCY:2}
    publication-builder-concurrency: ${MOERA_PUBLICATION_BUILDER_CONCURRENCY:2}
    publication-media-concurrency: ${MOERA_PUBLICATION_MEDIA_CONCURRENCY:4}
    publication-concurrency: ${MOERA_PUBLICATION_CONCURRENCY:4}
    channel-lease: 5m
    channel-schedule-interval: 1s
    publication-builder-schedule-interval: 1s
    publication-media-lease: 5m
    publication-media-schedule-interval: 1s
    publication-lease: 5m
    publication-schedule-interval: 1s
    media-compression-poll-interval: 10s
    startup-check-interval: 1s
    shutdown-grace-period: 30s
  storage:
    staging-directory: ${MOERA_STAGING_DIRECTORY:var/staging}
    staging-grace-period: 1h
    cleanup-interval: 1h
    cleanup-batch-size: 500
  retry:
    base-delay: 1s
    max-delay: 1h
    jitter-fraction: 0.2
